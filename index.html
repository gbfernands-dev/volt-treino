const STORAGE_KEY='volt_jump_tracker_2026_v2';

const to2=n=>String(n).padStart(2,'0');
function localDate(d){return `${d.getFullYear()}-${to2(d.getMonth()+1)}-${to2(d.getDate())}`}
function weekId(d){const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return localDate(m)}
let thisWeek=weekId(today);
const initialStore=()=>({version:2,weeks:{},loads:{},jumps:[],savedAt:null});
function loadStore(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return initialStore();const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object'||!parsed.weeks)return initialStore();return {...initialStore(),...parsed}}catch(err){savingWorks=false;return initialStore()}}
let store=loadStore();
function save(){store.savedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store));savingWorks=true}catch(err){savingWorks=false}}
function weekData(){return store.weeks[thisWeek]||(store.weeks[thisWeek]={})}
function dayData(id){const wk=weekData();return wk[id]||(wk[id]={})}
function exData(day,ex){const d=dayData(day);return d[ex.id]||(d[ex.id]={sets:[],count:0,target:ex.rep[1]})}
function completed(day,ex){return Math.min(exData(day,ex).sets.length,ex.sets)}
function metrics(day){let done=0,total=0;for(const x of day.ex){total+=x.sets;done+=completed(day.id,x)}return {done,total,percent:total?Math.round(done/total*100):0}}
function totalMetrics(){let done=0,total=0,days=0;for(const day of PLAN.filter(x=>!x.rest)){const m=metrics(day);done+=m.done;total+=m.total;if(m.total&&m.done===m.total)days++}return {done,total,days,percent:total?Math.round(done/total*100):0}}
const repText=ex=>`${ex.rep[0]}${ex.rep[0]!==ex.rep[1]?'–'+ex.rep[1]:''}${ex.unit||''}${ex.eachSide?' / lado':''}`;
const restText=s=>s>=60?(s%60?`${Math.floor(s/60)}min ${s%60}s`:`${Math.floor(s/60)}min`):`${s}s`;

function renderDayContent(day,m){return `<div class="small-card info-banner ${day.light?'warn':''}"><span class="info-ic">${day.light?'!':'↗'}</span><div><strong>${day.light?'Treino opcional · vôlei à noite':'Antes de começar'}</strong><p>${esc(day.warm)}<br><br>${esc(day.notice)}</p></div></div><div class="split-heading"><div><h2>Exercícios do dia</h2><p>Toque em qualquer um para contar as repetições.</p></div><span class="tiny-count">${m.percent}%</span></div><div class="exercise-list">${day.ex.map((x,i)=>{const ds=exData(day.id,x),done=completed(day.id,x),finished=done===x.sets;return `<button type="button" class="ex-card ${finished?'completed':''}" data-open-ex="${x.id}"><span class="ex-index">${finished?'✓':to2(i+1)}</span><div class="ex-main"><strong>${esc(x.name)}</strong><div class="ex-spec"><b>${x.sets} × ${repText(x)}</b> &nbsp;·&nbsp; descanso ${restText(x.rest)}</div><div class="dots">${Array.from({length:x.sets},(_,j)=>`<i class="${j<done?'done':''}"></i>`).join('')}</div></div><span class="ex-arrow">›</span></button>`}).join('')}</div><button type="button" class="start-action" data-next>${m.done===m.total?'Revisar treino concluído':m.done?'Continuar treino':'Começar treino'} &nbsp; ↗</button><p class="microcopy">${day.light?'Sexta é dia de recuperação ativa, não de sobrecarga. Se a energia estiver baixa, descanse pela manhã.':'Faça os saltos antes das cargas na terça. Em musculação, mantenha em geral 2 repetições em reserva. Descanso indicado é entre séries.'}</p>`}
function renderEvolucao(){const met=totalMetrics();const doneDays=PLAN.filter(d=>!d.rest).map(d=>({d,m:metrics(d)}));const entries=[...store.jumps].sort((a,b)=>b.date.localeCompare(a.date));const last=entries.length?entries[0].cm:75;const diff=last-75;
 $('main').innerHTML=nowHeader()+`<span class="eyebrow">SEU PAINEL</span><h1 class="t-section" style="font-size:39px;margin:11px 0 7px">Evolução<span style="color:var(--lime)">.</span></h1><p class="subhead" style="margin-bottom:22px">Acompanhe séries feitas e registre a altura real do seu salto, sempre da mesma forma.</p><div class="week-summary"><div class="statbox"><strong>${met.days}/5</strong><small>treinos completos</small></div><div class="statbox"><strong>${met.done}</strong><small>séries feitas</small></div><div class="statbox"><strong>${met.percent}%</strong><small>da semana</small></div></div><div class="split-heading spaced"><div><h2>Resumo da semana</h2><p>Semana iniciada em ${thisWeek.split('-').reverse().join('/')}</p></div></div><section class="small-card">${doneDays.map(({d,m})=>`<div class="week-row"><div class="mini-day">${d.short}</div><div class="week-middle"><strong>${esc(d.title)}</strong><small>${m.done}/${m.total} séries ${m.done===m.total?'· completo':''}</small></div><div class="mini-bar"><i style="width:${m.percent}%"></i></div></div>`).join('')}</section><div class="split-heading spaced"><div><h2>Minha impulsão</h2><p>Referência que você informou: 75 cm</p></div><span class="tiny-count">${last} cm</span></div><section class="small-card"><div style="display:flex;align-items:baseline;gap:13px"><span style="font-size:43px;font-weight:950;letter-spacing:-.08em;color:var(--lime)">${last}<small style="font-size:14px;letter-spacing:0"> cm</small></span><span style="font-size:12px;color:var(--muted)">${diff>0?'+':''}${diff} cm vs. referência</span></div><p class="subhead">Registre a melhor de até 3 tentativas após aquecimento, a cada 2 semanas. Use o mesmo método de medição.</p><div class="jump-form"><div class="fieldbox"><label class="field-label" for="jump-input">Altura medida (cm)</label><input id="jump-input" class="text-input" type="number" min="10" max="150" step="0.5" value="75" inputmode="decimal"></div><button type="button" class="small-action" id="add-jump">Registrar</button></div>${entries.length?`<div class="divider"></div>${entries.slice(0,5).map(e=>`<div class="week-row"><div class="week-middle"><strong>${e.cm} cm</strong><small>${esc(e.date.split('-').reverse().join('/'))}</small></div><span style="font-size:11px;color:var(--lime)">${e.cm>=75?'+':''}${Number((e.cm-75).toFixed(1))} cm</span></div>`).join('')}`:''}</section><p class="microcopy">Não confunda altura do caixote com altura real de salto vertical. A referência de 75 cm veio do seu relato, não de uma medição feita pelo aplicativo.</p>`;
 $('add-jump').onclick=()=>{const val=Number($('jump-input').value.replace(',','.'));if(!(val>=10&&val<=150)){toast('Informe uma altura válida entre 10 e 150 cm.');return}store.jumps.push({date:localDate(new Date()),cm:val});save();renderEvolucao();toast('Nova marca registrada!')};
}
function renderGuia(){$('main').innerHTML=nowHeader()+`<span class="eyebrow">SEU MANUAL</span><h1 class="t-section" style="font-size:39px;margin:11px 0 8px">Treinar melhor<span style="color:var(--lime)">.</span></h1><p class="subhead">As regras do plano, explicações e segurança em um lugar só.</p><div class="split-heading spaced"><h2>Por que o plano ficou assim?</h2></div><div class="notes-grid"><div class="note"><strong>01 · Sexta leve, domingo livre</strong><p>A segunda sessão virou uma ativação opcional de 15–25 minutos na sexta de manhã. O treino de vôlei à noite tem prioridade. Nada de treino no domingo.</p></div><div class="note"><strong>02 · Salto alto exige qualidade</strong><p>Na terça, 3 × 8 saltos no caixote com 150 segundos de intervalo. O número 8 é um teto prático, não uma obrigação se o salto piorar. Quanto maior a fadiga, menor a potência.</p></div><div class="note"><strong>03 · Panturrilha apenas uma vez</strong><p>A sessão principal de panturrilha ficou na terça. O vôlei já impõe muita carga aos tornozelos, então a repetição na sexta não é necessária por padrão.</p></div><div class="note"><strong>04 · Extensora e cadeira flexora</strong><p>Extensora entra como complemento de quadríceps e flexora sentada reforça posteriores. Não substituem a força principal do leg press e do stiff.</p></div><div class="note"><strong>05 · Peso corporal e massa muscular</strong><p>Como seu objetivo é saltar melhor, não force emagrecimento se já estiver leve. Se houver gordura a reduzir, prefira déficit pequeno, sono bom e proteína em geral por volta de 1,6–2,2 g/kg/dia. Evite dietas agressivas.</p></div><div class="note"><strong>06 · Joelho e recuperação</strong><p>O plano antigo citava joelho sensível. Dor ao saltar, inchaço ou instabilidade são sinais para parar o exercício e buscar avaliação. Ajuste as cargas à recuperação do vôlei.</p></div></div><div class="split-heading spaced"><h2>O que significa cada coisa?</h2></div><div class="notes-grid"><div class="note"><strong>3 × 10–12</strong><p>Três séries; faça de 10 a 12 repetições em cada uma. No contador você pode ajustar a meta tocando em + e −.</p></div><div class="note"><strong>RIR 2 / RIR 5</strong><p>RIR é quantas repetições ainda conseguiria fazer antes da falha. RIR 2 é exigente; RIR 5 é muito leve, ideal para sexta.</p></div><div class="note"><strong>Contador e descanso</strong><p>Toque no círculo grande uma vez por repetição. Depois marque “Concluir série” e o temporizador de descanso começa automaticamente, mesmo que você feche o exercício.</p></div></div><div class="split-heading spaced"><h2>Seus dados</h2></div><section class="small-card"><strong style="font-size:13px">Salvamento neste aparelho</strong><p class="subhead">O aplicativo tenta salvar automaticamente nesta aba/navegador. No iPhone, uma prévia do arquivo pelo app Arquivos pode não guardar os dados de modo confiável. Para garantir, exporte backups regularmente; a versão hospedada no Safari tende a ser mais estável.</p><div class="button-row" style="margin-top:13px"><button class="secondary" type="button" id="backup-btn">↓ Exportar backup</button><button class="secondary" type="button" id="import-btn">↑ Importar backup</button></div><div class="button-row" style="margin-top:10px"><button class="secondary" type="button" id="copy-btn">Copiar dados</button><button class="secondary danger" type="button" id="clear-btn">Zerar esta semana</button></div><div class="save-status">${savingWorks?'● Salvamento local disponível':'⚠ Salvamento local indisponível: faça backup antes de fechar.'}</div></section><div class="split-heading spaced"><h2>Base técnica</h2></div><section class="small-card"><p class="subhead">Revisões de treino de salto e orientações de força/pliometria da NSCA; posições da ISSN sobre proteína e composição corporal.</p><p class="subhead"><a href="https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/" target="_blank" rel="noopener noreferrer">NSCA · Pliometria</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/40469865/" target="_blank" rel="noopener noreferrer">Revisão de salto (2025)</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5477153/" target="_blank" rel="noopener noreferrer">ISSN · Proteínas</a></p><p class="microcopy" style="margin-bottom:0">Planejamento educativo, não substitui avaliação de treinador ou fisioterapeuta. Preferências e trocas de exercícios foram solicitadas por você.</p></section>`;
 $('backup-btn').onclick=exportBackup;$('import-btn').onclick=()=>$('import-file').click();$('copy-btn').onclick=copyBackup;$('clear-btn').onclick=()=>{if(confirm('Apagar as séries registradas na semana atual? As marcas de impulsão continuarão salvas.')){delete store.weeks[thisWeek];save();render();toast('Semana reiniciada.')}};

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hidden'),2700)}
function exportBackup(){const payload=JSON.stringify(store,null,2);const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`volt-backup-${localDate(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup pronto para salvar em Arquivos.')}
async function copyBackup(){const payload=JSON.stringify(store);try{await navigator.clipboard.writeText(payload);toast('Dados copiados. Salve em um local seguro.')}catch(err){const t=document.createElement('textarea');t.value=payload;document.body.append(t);t.select();try{document.execCommand('copy');toast('Dados copiados.')}catch(e){toast('Cópia não suportada nesta visualização.')}t.remove()}}
$('import-file').addEventListener('change',async function(){const file=this.files?.[0];if(!file)return;try{const str=await file.text();const value=JSON.parse(str);if(!value||typeof value!=='object'||!value.weeks||!Array.isArray(value.jumps))throw Error('Formato incompatível');if(!confirm('Substituir os dados atuais pelos dados deste backup?'))return;store={...initialStore(),...value};save();render();toast('Backup importado!')}catch(e){toast('Não foi possível importar este arquivo.')}finally{this.value=''}});

function formatClock(seconds){const n=Math.max(0,Math.ceil(seconds));return `${to2(Math.floor(n/60))}:${to2(n%60)}`}

 $('rest-15').onclick=()=>{if(restEndsAt)restEndsAt+=15000;else restPaused+=15;renderRest()};$('rest-toggle').onclick=()=>{if(restEndsAt){restPaused=restRemaining();restEndsAt=0}else{restEndsAt=Date.now()+restPaused*1000;restPaused=0}renderRest()};$('rest-stop').onclick=()=>{restEndsAt=restPaused=0;renderRest()};
}
function active(){if(!activeEx)return null;const day=PLAN.find(x=>x.id===activeEx.day);const ex=day?.ex.find(x=>x.id===activeEx.id);if(!ex)return null;return {day,ex,sd:exData(day.id,ex)}}
function openExercise(day,id){activeEx={day,id};holdSince=0;holdAccumulated=0;document.body.style.overflow='hidden';$('modal-wrap').classList.remove('hidden');renderSheet();}
function closeExercise(){if(holdSince&&activeEx){const a=active();if(a){a.sd.count=Math.max(0,Math.round((holdAccumulated+Date.now()-holdSince)/1000));save()}}activeEx=null;holdSince=0;holdAccumulated=0;$('modal-wrap').classList.add('hidden');document.body.style.overflow='';render()}
$('modal-wrap').addEventListener('click',e=>{if(e.target===$('modal-wrap'))closeExercise()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeEx)closeExercise()});
function renderSheet(){const a=active();if(!a)return;const {day,ex,sd}=a;const done=completed(day.id,ex);const finished=done>=ex.sets;const currentTarget=Number.isFinite(sd.target)?sd.target:ex.rep[1];const num=Math.max(0,Math.floor(sd.count||0));const load=store.loads[ex.id]??'';
 $('sheet').innerHTML=`<div class="handle"></div><div class="sheet-top"><div><div class="sheet-kicker">${esc(day.short)} · ${esc(ex.group)} · ${done+1>ex.sets?ex.sets:done+1}/${ex.sets} SÉRIES</div><h2>${esc(ex.name)}</h2></div><button class="close" type="button" id="modal-close" aria-label="Fechar">×</button></div><div class="set-tracker">${Array.from({length:ex.sets},(_,i)=>`<span class="${i<done?'done':i===done?'current':''}">${i<done?'✓':'S'+(i+1)}</span>`).join('')}</div>${finished?`<div class="sheet-complete"><strong>✓ Exercício concluído!</strong><p>Você marcou ${ex.sets} de ${ex.sets} séries. Seu progresso foi salvo no aparelho quando possível.</p></div><button type="button" class="finish-button" id="next-ex">Próximo exercício →</button><button type="button" class="bottom-link" id="reset-ex">Refazer este exercício</button>`:`<div class="counter-area"><button type="button" id="big-counter" class="counter-tap ${num>=currentTarget?'hit':''}" aria-label="${ex.hold?'Iniciar ou pausar cronômetro':'Adicionar uma repetição'}"><strong id="count-label">${ex.hold?formatClock(num):num}</strong><small>${ex.hold?'TOQUE PARA INICIAR / PAUSAR':'TOQUE PARA +1 REPETIÇÃO'}</small></button><div class="target-line"><button type="button" id="target-down" aria-label="Diminuir meta">−</button><span>Meta: <b id="target-val">${currentTarget}${ex.hold?' segundos':' repetições'}</b></span><button type="button" id="target-up" aria-label="Aumentar meta">+</button></div><div class="counter-toolbar"><button type="button" id="minus-one">${ex.hold?'−5 s':'−1 repetição'}</button><button type="button" id="reset-counter">Zerar contador</button></div></div><div class="modal-options"><div class="prescription"><span>SÉRIES · DESCANSO</span><strong>${ex.sets} × ${repText(ex)} · ${restText(ex.rest)}</strong></div><div class="fieldbox"><label class="field-label" for="load-input">Carga usada (kg) · opcional</label><input id="load-input" class="text-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Ex.: 20" value="${esc(load)}" ${ex.jump||ex.hold?'disabled':''}></div></div><button class="finish-button" type="button" id="finish-set" ${num===0?'disabled':''}>Concluir série ${done+1}/${ex.sets} ✓</button><div class="tip"><strong>Como fazer:</strong> ${esc(ex.tip)}</div><button type="button" class="bottom-link" id="modal-cancel">Fechar e continuar depois</button>`}`;
 $('modal-close').onclick=closeExercise;
 if(finished){$('next-ex').onclick=()=>{const next=day.ex.find(x=>completed(day.id,x)<x.sets);if(next)openExercise(day.id,next.id);else closeExercise()};$('next-ex').textContent=day.ex.some(x=>completed(day.id,x)<x.sets)?'Próximo exercício →':'Voltar para o treino ✓';$('reset-ex').onclick=()=>{if(confirm('Apagar as séries deste exercício e refazer?')){sd.sets=[];sd.count=0;save();renderSheet()}};return}
 $('modal-cancel').onclick=closeExercise;
 $('big-counter').onclick=()=>{if(ex.hold){if(holdSince){holdAccumulated+=Date.now()-holdSince;holdSince=0;sd.count=Math.round(holdAccumulated/1000)}else{holdAccumulated=sd.count*1000;holdSince=Date.now()}}else{sd.count=Math.max(0,(sd.count||0)+1)}save();updateCounterUI();};
 $('minus-one').onclick=()=>{if(ex.hold){holdSince=0;holdAccumulated=Math.max(0,(sd.count-5)*1000);sd.count=Math.max(0,sd.count-5)}else sd.count=Math.max(0,sd.count-1);save();updateCounterUI()};
 $('reset-counter').onclick=()=>{holdSince=0;holdAccumulated=0;sd.count=0;save();updateCounterUI()};
 $('target-down').onclick=()=>{sd.target=Math.max(ex.hold?5:1,(sd.target||ex.rep[1])-(ex.hold?5:1));save();updateCounterUI()};
 $('target-up').onclick=()=>{sd.target=Math.min(ex.hold?180:100,(sd.target||ex.rep[1])+(ex.hold?5:1));save();updateCounterUI()};
 $('load-input').addEventListener('change',e=>{const raw=e.target.value;store.loads[ex.id]=raw===''?'':String(Math.max(0,Number(raw)));save()});
 $('finish-set').onclick=()=>{if(holdSince){holdAccumulated+=Date.now()-holdSince;holdSince=0;sd.count=Math.max(0,Math.round(holdAccumulated/1000))}if(!sd.count){toast('Conte as repetições antes de concluir.');return}const raw=$('load-input').value;store.loads[ex.id]=raw===''?'':String(raw);sd.sets.push({reps:sd.count,kg:raw===''?null:Number(raw),at:new Date().toISOString()});sd.count=0;holdAccumulated=0;save();if(sd.sets.length<ex.sets)startRest(ex.rest);renderSheet();renderRest()};
}
function updateCounterUI(){const a=active();if(!a)return;const {ex,sd}=a;const n=Math.max(0,sd.count||0),goal=sd.target||ex.rep[1];const label=$('count-label');if(!label)return;label.textContent=ex.hold?formatClock(n):n;$('target-val').textContent=`${goal}${ex.hold?' segundos':' repetições'}`;$('big-counter').classList.toggle('hit',n>=goal);$('finish-set').disabled=n===0;}
setInterval(()=>{if(activeEx){const a=active();if(a?.ex.hold&&holdSince){a.sd.count=Math.max(0,Math.round((holdAccumulated+Date.now()-holdSince)/1000));updateCounterUI()}}if(restEndsAt||restPaused)renderRest()},450);
for(const b of $('nav').querySelectorAll('button'))b.onclick=()=>{if(activeEx)closeExercise();activeTab=b.dataset.tab;window.scrollTo({top:0,behavior:'instant'});render()};
if(!savingWorks)setTimeout(()=>toast('Seu navegador não permite salvar dados aqui. Exporte backups.'),700);
function checkDayChange(){const latest=new Date();if(localDate(latest)===localDate(today))return;today=latest;todayWeekday=today.getDay();thisWeek=weekId(today);selectedDay=PLAN.find(d=>d.idx===todayWeekday)?.id||'seg';if(activeEx)closeExercise();render();toast('Novo dia! O treino foi atualizado.');}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDayChange()});window.addEventListener('pageshow',checkDayChange);setInterval(checkDayChange,60000);
render();
</script>
</body>
</html>
